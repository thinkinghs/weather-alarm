name: Daily Weather Briefing

on:
  schedule:
    # UTC 21:30 = KST 06:30 (다음날). GitHub Actions peak-time 지연(최대 30분)을 감안해 30분 일찍 트리거
    - cron: '30 21 * * *'
  # 수동 실행 트리거
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Send daily briefing
        # 시크릿은 GitHub이 자동 마스킹하지만,
        # 변형·조합 변수는 마스킹되지 않으므로 절대 가공하여 echo하지 말 것
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
          AIRKOREA_API_KEY: ${{ secrets.AIRKOREA_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}
          LOCATION_NX: ${{ vars.LOCATION_NX }}
          LOCATION_NY: ${{ vars.LOCATION_NY }}
          SIDO_NAME: ${{ vars.SIDO_NAME }}
          STATION_NAME: ${{ vars.STATION_NAME }}
          LOCATION_DISPLAY_NAME: ${{ vars.LOCATION_DISPLAY_NAME }}
        run: uv run python -m src.main
