repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key       # RSA/DSA/EC 개인키 패턴 감지
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: check-ast                 # Python 문법 검사

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # 아래 패턴은 .env.example의 플레이스홀더이므로 제외
        args:
          - '--exclude-files'
          - '\.env\.example$'
